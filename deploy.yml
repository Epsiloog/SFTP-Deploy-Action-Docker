name: 🚀 CD en SFTP
on:
  push:
    tags:
      - '202*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Cloner le repository
        uses: actions/checkout@v4

      - name: 🐳 Construire l’image Docker
        run: docker build -t sftp-deploy .

      - name: 🚀 Exécuter le script de déploiement
        run: docker run --rm \
          -e SFTP_USER=${{ secrets.SUSERNAME_SSH }} \
          -e SFTP_HOST=${{ secrets.SERVER_SSH }} \
          -e SFTP_PORT=${{ secrets.SSH_PORT }} \
          -e SFTP_PASSWORD=${{ secrets.PASSWORD_SSH }} \
          -e SFTP_REMOTE_DIR=${{ secrets.REMOTE_DIR }} \
          -e GITHUB_PRIVATE_KEY=${{ secrets.SSH_PRIVATE_KEY }} \
          sftp-deploy

      - name: Display Tag Name
        run: echo "Tag pushed = ${{ github.ref }}""
